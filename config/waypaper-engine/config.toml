[app]
font_family_body = ''
font_family_display = ''
font_family_mono = ''
font_preset = 'bundled'
image_history_limit = 100
images_per_page = 50
kill_daemon_on_exit = false
minimize_instead_of_close = false
notifications = true
show_monitor_modal_on_start = true
sort_by = 'imported_at'
sort_order = 'desc'
start_minimized = false
startup_intro = true
theme = 'kolision-raw'

[backend]
selection_mode = 'auto'
type = 'awww'

[backend.auto_priorities]
image = ['hyprpaper', 'awww', 'swaybg', 'feh', 'wal-qt']
video = ['mpvpaper', 'wal-qt']
web = ['wal-qt']

[backend.awww]
daemon_format = ''
fill_color = '000000'
filter_type = 'Lanczos3'
invert_y = false
resize = 'crop'
transition_angle = 45
transition_bezier = '0.25,0.1,0.25,1.0'
transition_duration = 3
transition_fps = 60
transition_pos = 'center'
transition_step = 90
transition_type = 'wipe'
transition_wave = '20,20'

[backend.feh]
mode = 'fill'

[backend.hyprpaper]
config_path = ''
fit_mode = 'cover'

[backend.mpvpaper]
auto_pause = false
auto_stop = false
layer = ''
mpv_options = 'loop'
slideshow_secs = 0
verbose = 0

[backend.swaybg]
fit_mode = 'fill'

[backend.wal-qt]
allow_network_wallpapers = false
connect_timeout_ms = 500
duration_ms = 300
env = []
expected_api_version = '0'
expected_service = 'wal-qt'
fill_color = '000000ff'
image_fit_mode = 'cover'
image_rendering = 'auto'
load_timeout_ms = 15000
parallax_animation_ms = 600
parallax_compositor_driver = 'auto'
parallax_direction = 'horizontal'
parallax_easing = '0.215,0.610,0.355,1.000'
parallax_enabled = false
parallax_reset_ms = 400
parallax_step_percent = 5
parallax_workspace_chunk_size = 10
parallax_zoom = 120
request_timeout_ms = 1500
socket_path = '/run/user/1000/wal-qt.sock'
transition = 'none'
transition_angle_deg = 0
transition_bezier = '0.54,0,0.34,0.99'
transition_origin_x_percent = 50
transition_origin_y_percent = 50
transition_wave_amplitude_percent = 5.0
transition_wave_frequency = 3.0
video_audio_default = false

[daemon]
compositor = 'auto'
database_dir = '/home/pilot/.local/share/waypaper-engine/db'
images_dir = '/home/pilot/.local/share/waypaper-engine/images'
log_file = '/home/pilot/.local/share/waypaper-engine/daemon.log'
log_level = 'info'
log_max_backups = 3
log_max_size_mb = 10
socket_path = '/run/user/1000/waypaper-engine.sock'
thumbnails_dir = '/home/pilot/.cache/waypaper-engine/thumbnails'

[monitors]
image_set_type = 'individual'
selected_monitors = ['DP-2']

[wallhaven]
api_key = ''
blur_nsfw_thumbnails = true
enabled = false
scroll_mode = 'paginated'
